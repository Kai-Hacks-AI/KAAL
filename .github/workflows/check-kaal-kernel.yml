name: check-kaal-kernel
on:
  pull_request:
  push:
    branches: [main, kaal/genesis]
jobs:
  check-kaal-kernel:
    name: check-kaal-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check-kaal-kernel
