# Sealing on main: every push to main closes the BRAIN learnings it brought,
# by running KAAL's sealing (npm run seal, which seals through using-seals)
# and committing the new seal state back to main. This is the only writer of
# seal state; every change is refused if it writes seal state itself.
#
# Only the pushed branch's own, already reviewed code runs here. Runs are
# serialized so two sealings never overlap. Sealing refuses, writing nothing,
# when BRAIN is invalid or a seal is broken; the run then fails and main stays
# unsealed until a fix lands. The commit is pushed with the workflow token,
# which starts no further workflow runs.
name: sealing

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sealing-main
  cancel-in-progress: false

jobs:
  sealing:
    name: sealing-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Seal main as it is now, not the commit that triggered this run:
          # a queued run then seals everything pushed before it.
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seal
      - name: Commit the new seal state
        run: |
          git add -- brain/learning
          if git diff --cached --quiet; then
            echo "Nothing new to seal."
            exit 0
          fi
          # Sealing writes only seal.json files and the chain heads; anything
          # else staged here means something is wrong, so nothing is pushed.
          unexpected=$(git diff --cached --name-only | grep -vE '(^|/)seal\.json$|^brain/learning/seals\.json$' || true)
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit files that are not seal state:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seal BRAIN learnings" -m "$(git diff --cached --name-only | sed -n 's|^brain/learning/\(.*\)/seal\.json$|Sealed \1|p')"
          git push origin HEAD:main
