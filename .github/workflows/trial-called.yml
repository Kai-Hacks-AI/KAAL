name: trial called
on:
  workflow_call:
permissions:
  contents: read
jobs:
  called:
    name: called
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: |
          echo "event=${{ github.event_name }} sha=${{ github.sha }} base=${{ github.event.merge_group.base_ref }}"
          echo "main checkout: $(git rev-parse HEAD)"
          { echo "event=${{ github.event_name }}"; echo "run sha=${{ github.sha }}"; echo "checker (main) sha=$(git rev-parse HEAD)"; } >> "$GITHUB_STEP_SUMMARY"
