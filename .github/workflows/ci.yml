# Runs KAAL's tests. Each check calls one npm script; what a lane tests is
# defined there and in the code it runs, never here.
# Hosting is KAAL's host boundary: its conformance suite runs on every
# supported OS. Acceptance, a fresh install of the packed packages, also runs
# on every supported OS: Linux in the lanes below, Windows and macOS here.
# Everything else is checked once, on a reference host.
name: KAAL

on:
  push:
    branches: [main, "kaal/**"]
  pull_request:

permissions:
  contents: read

jobs:
  hosting:
    name: Hosting (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: Linux, os: ubuntu-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:hosting

  acceptance:
    name: Acceptance (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:acceptance

  lane:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: Workspaces, script: "test:workspaces" }
          - { check: Acceptance, script: "test:acceptance" }
          - { check: Engineering, script: "test:engineering" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run ${{ matrix.script }}
