# Runs KAAL's tests. Each job runs one check that KAAL lists in guard.json through kaal-guard, which
# reports its verdict; what a check tests is defined there and in the code it runs, never here. The
# Guard jobs run Guard's declared suites through engineering/guard/suites.mjs (guard/C129), and the
# Linux one also runs kaal-guard verify, which shows that a job declares every ci check in Guard's
# declared form (declared integration only). The suites are the ones Guard's three Test Plans declare,
# Embedded, Engineering and External, each with its owner and prerequisites and no host: every suite is
# expected on every supported host. So each Guard job, on Linux and in Guard (Windows, macOS), provides
# the same prerequisites (the workspace, installed and built, and the npm registry, which runners reach)
# and runs every declared suite. Each writes a run record for this host and the candidate it checked
# out, with every declared case's outcome, and uploads it, even when a case failed. Guard (gate) reads
# the three records and judges them as a release would (suites.mjs --gate), for the same candidate.
# Each Guard job has a timeout, so a hang ends as a failure with its log rather than holding the run.
# Hosting is KAAL's host boundary: its conformance suite runs on every
# supported OS. Acceptance, a fresh install of the packed packages, also runs
# on every supported OS: Linux in the lanes below, Windows and macOS here.
# Everything else is checked once, on a reference host.
name: KAAL

on:
  push:
    branches: [main, "kaal/**"]
  pull_request:

permissions:
  contents: read

jobs:
  hosting:
    name: Hosting (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: Linux, os: ubuntu-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check Hosting --github

  acceptance:
    name: Acceptance (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check Acceptance --github

  lane:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry's check is its name in guard.json; script names the npm script guard.json runs for it.
        include:
          - { check: Workspaces, script: "test:workspaces" }
          - { check: Acceptance, script: "test:acceptance" }
          - { check: Engineering, script: "test:engineering" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check ${{ matrix.check }} --github

  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node engineering/guard/suites.mjs --record "${{ runner.temp }}/guard-run-record-${{ runner.os }}.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-run-record-${{ runner.os }}
          path: ${{ runner.temp }}/guard-run-record-${{ runner.os }}.json
          if-no-files-found: error
      - run: npx --no kaal-guard verify --github

  guard-hosts:
    name: Guard (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node engineering/guard/suites.mjs --record "${{ runner.temp }}/guard-run-record-${{ runner.os }}.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-run-record-${{ runner.os }}
          path: ${{ runner.temp }}/guard-run-record-${{ runner.os }}.json
          if-no-files-found: error

  guard-gate:
    name: Guard (gate)
    needs: [guard, guard-hosts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guard-run-record-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - run: node engineering/guard/suites.mjs --gate "$(git rev-parse HEAD)" --hosts linux,darwin,win32 "${{ runner.temp }}"/records/*.json
