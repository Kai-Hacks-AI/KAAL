# Runs KAAL's tests. Each job runs one check that KAAL lists in guard.json through kaal-guard, which
# reports its verdict; what a check tests is defined there and in the code it runs, never here. The
# Guard jobs run Guard's declared suites through engineering/guard/suites.mjs (guard/C129), and the
# Linux one also runs kaal-guard verify, which shows that a job declares every ci check in Guard's
# declared form (declared integration only). The suites are the ones Guard's three Test Plans declare,
# Embedded, Engineering and External, each with its owner and the hosts it runs on; this file names no
# test file. On each host the script runs every suite declared for that host, prints one line per suite
# with its owner and outcome, and names each suite left out of that host with its plan's reason; such a
# suite is never counted as passed. Guard runs on Linux, and on Windows and macOS in Guard (Windows,
# macOS). The Linux Guard job builds KAAL's workspace first, since guard/T46's file
# (workspace.test.mjs) needs it.
# Hosting is KAAL's host boundary: its conformance suite runs on every
# supported OS. Acceptance, a fresh install of the packed packages, also runs
# on every supported OS: Linux in the lanes below, Windows and macOS here.
# Everything else is checked once, on a reference host.
name: KAAL

on:
  push:
    branches: [main, "kaal/**"]
  pull_request:

permissions:
  contents: read

jobs:
  hosting:
    name: Hosting (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: Linux, os: ubuntu-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check Hosting --github

  acceptance:
    name: Acceptance (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check Acceptance --github

  lane:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry's check is its name in guard.json; script names the npm script guard.json runs for it.
        include:
          - { check: Workspaces, script: "test:workspaces" }
          - { check: Acceptance, script: "test:acceptance" }
          - { check: Engineering, script: "test:engineering" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard run --check ${{ matrix.check }} --github

  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node engineering/guard/suites.mjs
      - run: npx --no kaal-guard verify --github

  guard-hosts:
    name: Guard (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node engineering/guard/suites.mjs
