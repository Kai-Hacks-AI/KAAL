# Relay for Change Isolation's review-event handler. A pull_request_review event runs the workflow
# definition found on the pull request's merge ref, so a candidate could edit this file; it is therefore
# trusted for nothing. It only records the pull request's number as an artifact. The handler
# (change-isolation-review.yml) runs from the default branch on this workflow's completion and
# reacquires every fact itself.
name: Change Isolation review relay

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    name: Relay review event
    runs-on: ubuntu-latest
    steps:
      - name: Record the pull request number
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PULL_REQUEST" > pull-request.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pull-request
          path: pull-request.txt
          retention-days: 1
