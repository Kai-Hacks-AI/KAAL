# Carries out the trusted part of KAAL's Regression Plan: test/regression-plan.md
#
# Runs `npm run regression:check` from main against a pull request: main's
# cases, chosen by main's links, run against the change's code with main's
# test runner, and every commitment of main the change does not retain must be
# superseded in BRAIN. The script decides what counts, not this workflow.
#
# On a pull request this runs as pull_request_target: GitHub takes the
# workflow and main's checkout from the default branch, never from the change,
# so a change cannot weaken the checks that judge it. The gate therefore
# applies to pull requests into every branch once this workflow is on main,
# and to none before. Unlike the seal checks, this runs the change's code, so
# that runs in a job that holds no write permission, no secret and no
# dependency cache; the jobs that write the regression-linux commit status
# never check the change out.
#
# A result holds only for the main it was judged by. When main moves, every
# open pull request's regression-linux status is set to failure, and a
# success is only published if main has not moved while the change was
# judged: the change must be derived from the new main, and pushing that
# runs this again.
name: regression

on:
  push:
    branches: [main]
  pull_request_target:

permissions: {}

jobs:
  invalidate:
    name: regression-invalidate-linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAIN: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          for head in $(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.sha'); do
            gh api "repos/$REPO/statuses/$head" -f state=failure -f context=regression-linux -f target_url="$RUN_URL" -f description="main moved to ${MAIN:0:12}: derive the change from it"
          done

  start:
    name: regression-start-linux
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_URL: repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: gh api "$STATUS_URL" -f state=pending -f context=regression-linux -f target_url="$RUN_URL" -f description="Judging the change by main's regression"

  run:
    name: regression-run-linux
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main: ${{ steps.main.outputs.sha }}
    steps:
      - run: git config --global core.autocrlf true
      # main's latest commit, named explicitly: the regression that judges the
      # change, whatever branch the pull request targets.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - id: main
        run: echo "sha=$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: change
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: trusted
      - run: npm ci --ignore-scripts
        working-directory: change
      - run: npm run regression:check -- ../change
        working-directory: trusted

  report:
    name: regression-report-linux
    needs: run
    if: always() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_URL: repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.run.result }}
      JUDGED_BY: ${{ needs.run.outputs.main }}
      REPO: ${{ github.repository }}
    steps:
      # Success is published before main is checked again, so either the
      # check below or the invalidation a later move of main triggers is
      # always the last to write the status.
      - run: |
          if [ "$RESULT" != success ]; then
            gh api "$STATUS_URL" -f state=failure -f context=regression-linux -f target_url="$RUN_URL" -f description="main's regression does not hold for the change"
            exit 0
          fi
          gh api "$STATUS_URL" -f state=success -f context=regression-linux -f target_url="$RUN_URL" -f description="main's regression holds"
          if [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" != "$JUDGED_BY" ]; then
            gh api "$STATUS_URL" -f state=failure -f context=regression-linux -f target_url="$RUN_URL" -f description="main moved while the change was judged: derive it from main again"
          fi
