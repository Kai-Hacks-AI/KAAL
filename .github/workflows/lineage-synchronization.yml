# Lineage Synchronization: verifies the result a pull request proposes for the default branch or for
# a kaal/* lineage against the default branch's current state. It realizes two KAAL flows in Git
# terms; what a Change may contain is Change Isolation's to judge.
#
# Promote (kaal/* -> default): fresh when merging the promotion yields exactly the tree validated on
# its head. A stale promotion fails and is told how to refresh it: rebase its Change onto the default
# branch's tip in a working branch, take it into a new kaal/* lineage established at that tip, and
# resubmit the promotion from there.
#
# Synchronize (default -> an existing kaal/* lineage): the lineage receives the default branch's
# current state with its own outstanding Changes kept, as one pull request that lands by squash or
# rebase. .github/lineage/synchronization.sh defines and verifies it; a pull request into kaal/*
# without a Synchronized-with line is an ordinary Change and not applicable here.
#
# Nothing here synchronizes, rebases or merges. pull_request_target runs this workflow, and the
# script, as they stand on the default branch. Branches are read at their current tips, never the
# event's base.sha; the candidate's commits are fetched as Git data only: nothing of the candidate is
# checked out, built, installed or run. When the default branch advances, the revalidate job re-runs
# this check on every open promotion and synchronization, so an earlier pass does not outlive the
# tip it was judged against.
name: Lineage Synchronization

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  lineage-synchronization:
    name: Lineage Synchronization
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The fetch is unauthenticated: this repository is public. If it ever goes private, this fails closed.
      - name: Judge the proposed result against the default branch
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail() { echo "::error title=Lineage Synchronization::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ "$BASE_REF" = "$DEFAULT" ]; then
            if [ "$HEAD_REPO" != "$REPO" ] || [[ "$HEAD_REF" != kaal/* ]]; then
              echo "Not applicable: $HEAD_REPO:$HEAD_REF -> $BASE_REF is not a kaal/* promotion."; exit 0; fi
          elif [[ "$BASE_REF" != kaal/* ]]; then
            echo "Not applicable: $BASE_REF is neither $DEFAULT nor a kaal/* lineage."; exit 0
          fi
          git init -q lineage && cd lineage
          git fetch -q --no-tags "$SERVER/$REPO" "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT" \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "$HEAD"
          TIP=$(git rev-parse "refs/remotes/origin/$DEFAULT")

          if [ "$BASE_REF" = "$DEFAULT" ]; then
            if OUT=$(git merge-tree --write-tree --name-only --no-messages "$TIP" "$HEAD"); then
              [ "${OUT%%$'\n'*}" = "$(git rev-parse "$HEAD^{tree}")" ] && {
                echo "Fresh: merging $HEAD_REF ($HEAD) into $DEFAULT ($TIP) yields exactly the head's validated tree."; exit 0; }
              WHY="merging it into the current $DEFAULT tip $TIP would produce a tree that was never validated on its head"
            else
              WHY="it conflicts with the current $DEFAULT tip $TIP on $(tail -n +2 <<< "$OUT" | sed '/^$/d' | sort -u | paste -sd' ')"
            fi
            fail "$HEAD_REF is not fresh: $WHY. Refresh the promotion: rebase its Change onto $TIP in a working branch, open that branch into a new kaal/* lineage established at $TIP, merge it through its normal checks, and resubmit the promotion from that lineage, superseding this pull request."
          fi

          git show "$TIP:.github/lineage/synchronization.sh" > ../synchronization.sh
          bash ../synchronization.sh "$TIP" "$(git rev-parse "refs/remotes/origin/$BASE_REF")" "$HEAD" > ../resolved 2> ../verdict || RC=$?
          case ${RC:-0} in
            0) echo "Synchronized: $HEAD_REF -> $BASE_REF $(cat ../verdict)" ;;
            3) echo "Not applicable: $(cat ../verdict); an ordinary Change into $BASE_REF." ;;
            1) fail "$HEAD_REF -> $BASE_REF: $(cat ../verdict)" ;;
            *) fail "$HEAD_REF -> $BASE_REF cannot be judged: $(cat ../verdict)" ;;
          esac

  revalidate:
    name: Revalidate open promotions and synchronizations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Lineage Synchronization on every open kaal/* promotion and every pull request into kaal/*
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$REPO/pulls?state=open" \
            --jq ".[] | select((.base.ref == \"$DEFAULT\" and .head.repo.full_name == \"$REPO\" and (.head.ref | startswith(\"kaal/\"))) or (.base.ref | startswith(\"kaal/\"))) | \"\(.number) \(.head.sha)\"" |
          while read -r PR SHA; do
            RUN=$(gh api "repos/$REPO/actions/workflows/lineage-synchronization.yml/runs?event=pull_request_target&head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status)"')
            if [ -z "$RUN" ]; then
              echo "#$PR: no Lineage Synchronization run on $SHA yet; its next pull request event judges it."
              continue
            fi
            read -r ID STATUS <<< "$RUN"
            if [ "$STATUS" != "completed" ]; then
              echo "#$PR: run $ID is $STATUS; not re-run."
              continue
            fi
            gh api -X POST "repos/$REPO/actions/runs/$ID/rerun" >/dev/null
            echo "#$PR: re-ran $ID against the new $DEFAULT tip."
          done
