# Lineage Synchronization: runs the branching checker, engineering/github/lineage.ts, on the result a
# pull request proposes. Into the default branch it judges promotion freshness; into any other branch
# it judges a synchronization (not applicable to an ordinary Change). The verdicts and their guidance
# live only in the checker and engineering/github/branching.md; this workflow supplies Git data and
# reports the outcome. Nothing here synchronizes, rebases or merges.
#
# pull_request_target runs this workflow, and the checker, as they stand on the default branch.
# Branches are read at their current tips, never the event's base.sha; the candidate's commits are
# fetched as Git data only: nothing of the candidate is checked out, built, installed or run. When
# the default branch advances, the revalidate job re-runs this check on every open pull request into
# the default branch from kaal/* and into kaal/*, so an earlier pass does not outlive the tip it was
# judged against.
name: Lineage Synchronization

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  lineage-synchronization:
    name: Lineage Synchronization
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The fetch is unauthenticated: this repository is public. If it ever goes private, this fails closed.
      - name: Judge the proposed result with the default branch's checker
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q lineage && cd lineage
          git fetch -q --no-tags "$SERVER/$REPO" "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT" \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "$HEAD"
          git show "refs/remotes/origin/$DEFAULT:engineering/github/lineage.ts" > "$RUNNER_TEMP/lineage.ts" || {
            echo "::error title=Lineage Synchronization::cannot judge: $DEFAULT does not hold engineering/github/lineage.ts"; exit 1; }
          if [ "$BASE_REF" = "$DEFAULT" ]; then
            set -- freshness "$DEFAULT" "refs/remotes/origin/$DEFAULT" "$HEAD_REF" "$HEAD"
          else
            set -- synchronization "$DEFAULT" "$BASE_REF" "refs/remotes/origin/$DEFAULT" "refs/remotes/origin/$BASE_REF" "$HEAD"
          fi
          RC=0; node "$RUNNER_TEMP/lineage.ts" "$@" > "$RUNNER_TEMP/verdict" 2>&1 || RC=$?
          cat "$RUNNER_TEMP/verdict" >> "$GITHUB_STEP_SUMMARY"
          # 0 pass; 3 this verdict does not apply (an ordinary Change), reported as such; 1 fail; 2 or
          # anything else cannot judge, which fails closed.
          case $RC in
            0) cat "$RUNNER_TEMP/verdict" ;;
            3) echo "Not applicable: $(cat "$RUNNER_TEMP/verdict")" ;;
            1) echo "::error title=Lineage Synchronization::$(cat "$RUNNER_TEMP/verdict")"; exit 1 ;;
            *) echo "::error title=Lineage Synchronization: cannot judge::$(cat "$RUNNER_TEMP/verdict")"; exit 1 ;;
          esac

  revalidate:
    name: Revalidate open promotions and synchronizations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Lineage Synchronization on every open kaal/* promotion and every pull request into kaal/*
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$REPO/pulls?state=open" \
            --jq ".[] | select((.base.ref == \"$DEFAULT\" and .head.repo.full_name == \"$REPO\" and (.head.ref | startswith(\"kaal/\"))) or (.base.ref | startswith(\"kaal/\"))) | \"\(.number) \(.head.sha)\"" |
          while read -r PR SHA; do
            RUN=$(gh api "repos/$REPO/actions/workflows/lineage-synchronization.yml/runs?event=pull_request_target&head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status)"')
            if [ -z "$RUN" ]; then
              echo "#$PR: no Lineage Synchronization run on $SHA yet; its next pull request event judges it."
              continue
            fi
            read -r ID STATUS <<< "$RUN"
            if [ "$STATUS" != "completed" ]; then
              echo "#$PR: run $ID is $STATUS; not re-run."
              continue
            fi
            gh api -X POST "repos/$REPO/actions/runs/$ID/rerun" >/dev/null
            echo "#$PR: re-ran $ID against the new $DEFAULT tip."
          done
