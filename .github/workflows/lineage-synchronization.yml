# Lineage Synchronization: a kaal/* -> default-branch promotion must already contain the default
# branch's current tip. A promotion that does not is told how to catch up: one synchronization pull
# request from the default branch into its lineage, merged through that lineage's normal checks with
# a merge commit, after which this check re-runs on the promotion's new head. Nothing here
# synchronizes, rebases or merges anything.
#
# This is a provider-side gate on Git ancestry alone, separate from Change Isolation's changed-path
# judgment and from Promotion Source's judgment of where a promotion comes from. Pull requests that
# are not a kaal/* promotion of this repository into the default branch report not applicable.
#
# pull_request_target runs this workflow as it stands on the default branch. The default branch is
# read at its current tip, never the event's base.sha, and the candidate's commits are fetched as Git
# data only: nothing is checked out, built, installed or run. Freshness: when the default branch
# advances, the revalidate job re-runs this check on every open promotion, so an earlier pass does
# not outlive the tip it was judged against.
name: Lineage Synchronization

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  lineage-synchronization:
    name: Lineage Synchronization
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The fetch is unauthenticated: this repository is public. If it ever goes private, this fails closed.
      - name: Judge the promotion's ancestry against the default branch
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_REF" != "$DEFAULT" ] || [ "$HEAD_REPO" != "$REPO" ] || [[ "$HEAD_REF" != kaal/* ]]; then
            echo "Not applicable: $HEAD_REPO:$HEAD_REF -> $BASE_REF is not a kaal/* promotion into $DEFAULT."
            exit 0
          fi
          git init -q lineage && cd lineage
          git fetch -q --no-tags --filter=tree:0 "$SERVER/$REPO" "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT" "$HEAD"
          TIP=$(git rev-parse "refs/remotes/origin/$DEFAULT")
          if git merge-base --is-ancestor "$TIP" "$HEAD"; then
            echo "Synchronized: $HEAD_REF ($HEAD) contains the current $DEFAULT tip ($TIP)."
            exit 0
          fi
          BEHIND=$(git rev-list --count "$HEAD..$TIP")
          MSG="$HEAD_REF does not contain the current $DEFAULT tip $TIP ($BEHIND commit(s) behind). Create one synchronization pull request from $DEFAULT into $HEAD_REF, merge it through its normal checks with a merge commit so that $DEFAULT's history is kept, then revalidate this promotion: this check re-runs on its new head."
          echo "::error title=Lineage Synchronization::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  revalidate:
    name: Revalidate open promotions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Lineage Synchronization on every open kaal/* promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$REPO/pulls?state=open&base=$DEFAULT" \
            --jq ".[] | select(.head.repo.full_name == \"$REPO\" and (.head.ref | startswith(\"kaal/\"))) | \"\(.number) \(.head.sha)\"" |
          while read -r PR SHA; do
            RUN=$(gh api "repos/$REPO/actions/workflows/lineage-synchronization.yml/runs?event=pull_request_target&head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status)"')
            if [ -z "$RUN" ]; then
              echo "#$PR: no Lineage Synchronization run on $SHA yet; its next pull request event judges it."
              continue
            fi
            read -r ID STATUS <<< "$RUN"
            if [ "$STATUS" != "completed" ]; then
              echo "#$PR: run $ID is $STATUS; not re-run."
              continue
            fi
            gh api -X POST "repos/$REPO/actions/runs/$ID/rerun" >/dev/null
            echo "#$PR: re-ran $ID against the new $DEFAULT tip."
          done
