name: Experiment required workflow
# Disposable experiment (defect): is a workflow required by an organization ruleset enforced for this public repository?
# Not wired anywhere; delete this branch when the experiment ends.
# Phase B (follow-up): fails on purpose to see whether a failing required workflow blocks the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
permissions: {}
jobs:
  experiment:
    name: Experiment required workflow
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "required workflow FAILS on purpose (phase B)"
          exit 1
