# Throwaway evidence for #16, never merged: runs Change Isolation's own judge step on a real runner,
# and fetches fork PR heads by exact SHA from a public base repository.
name: Change Isolation probe
on:
  pull_request:
    branches: [claude/project-thread-ytlrli]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Same-repo PR heads, judged by the exact step in change-isolation.yml
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          yq '.jobs["change-isolation"].steps[1].run' .github/workflows/change-isolation.yml > judge.sh
          set +e
          BASE=$BASE HEAD=$HEAD bash -eo pipefail judge.sh; echo "this probe PR (.github only): exit $? (want 0)"
          BASE=$BASE HEAD=ee4cc5f81108e24e81e18b3da85c3de09ccefb7c bash -eo pipefail judge.sh; echo "Core+package probe head of closed #19: exit $? (want 1)"
          git cat-file -e "$HEAD^{commit}" && echo "same-repo head $HEAD fetched by SHA: ok"
      - name: Fork PR heads fetched by exact SHA from the base repository
        run: |
          curl -fsS "https://api.github.com/repos/actions/checkout/pulls?state=all&per_page=100" > pulls.json
          python3 - <<'PY' > shapes.txt
          import json
          seen = {}
          for p in json.load(open("pulls.json")):
              hr = p["head"]["repo"]
              shape = "fork-deleted" if hr is None else ("fork" if hr["full_name"] != "actions/checkout" else "same-repo")
              shape += "/" + ("merged" if p["merged_at"] else p["state"])
              seen.setdefault(shape, (p["number"], p["head"]["sha"]))
          for shape, (n, sha) in sorted(seen.items()):
              print(shape, n, sha)
          PY
          fail=0
          while read -r shape n sha; do
            rm -rf f && git init -q f
            if git -C f fetch -q --no-tags --depth=1 https://github.com/actions/checkout "$sha" && git -C f cat-file -e "$sha^{commit}"; then r=ok; else r=FAILED; fail=1; fi
            echo "actions/checkout #$n $shape head $sha: $r"
          done < shapes.txt
          exit $fail
