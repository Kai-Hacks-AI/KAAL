# Disposable experiment for release/C129: does an alert open on the base show up on the merge ref of an unrelated pull request?
# Never merged. Only runs for the disposable base branch below.
name: Experiment inherited CodeQL
on:
  push:
    branches: [claude/exp-codeql-base]
  pull_request:
    branches: [claude/exp-codeql-base]
permissions:
  contents: read
jobs:
  analyze:
    name: Experiment CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - experiment
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /exp:inherited
  judge:
    name: Experiment judge
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODEQL_EXPECTED: /exp:inherited
      CODEQL_ANALYZE_RESULT: ${{ needs.analyze.result }}
      CODEQL_SECURITY_ALERTS_THRESHOLD: high_or_higher
      CODEQL_ALERTS_THRESHOLD: errors
      CODEQL_WAIT_SECONDS: "300"
      CODEQL_POLL_SECONDS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Observe
        run: |
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "--- alerts on the merge ref"
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=$GITHUB_REF&per_page=100" --jq '.[] | {number, rule: .rule.id, sev: .rule.security_severity_level, level: .rule.severity, path: .most_recent_instance.location.path}' || echo "alerts read failed"
          echo "--- alerts on the base ref"
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/claude/exp-codeql-base&per_page=100" --jq '.[] | {number, rule: .rule.id, sev: .rule.security_severity_level, path: .most_recent_instance.location.path}' || echo "alerts read failed"
          echo "--- analysis judge"
          node engineering/release-management/05-src/codeql-gate/judge-codeql-analysis.mjs --out "$RUNNER_TEMP/analysis.json"; echo "command exit $?"
          node packages/kaal-controls/skills/kaal-controls/scripts/judge-mode.mjs --mode preventive --findings "$RUNNER_TEMP/analysis.json"; echo "verdict exit $?"
          echo "--- findings judge"
          node engineering/release-management/05-src/codeql-gate/judge-codeql-findings.mjs --out "$RUNNER_TEMP/findings.json"; echo "command exit $?"
          cat "$RUNNER_TEMP/findings.json" 2>/dev/null; echo
          node packages/kaal-controls/skills/kaal-controls/scripts/judge-mode.mjs --mode preventive --findings "$RUNNER_TEMP/findings.json"; echo "verdict exit $?"
        continue-on-error: true
      - name: Dismiss the test alerts
        if: ${{ always() }}
        run: |
          for ref in "$GITHUB_REF" refs/heads/claude/exp-codeql-base; do
            for n in $(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=$ref&per_page=100" --jq '.[] | select(.most_recent_instance.location.path | startswith("experiment/")) | .number'); do
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$n" -f state=dismissed -f dismissed_reason="used in tests" -f dismissed_comment="Disposable experiment for release/C129" --jq '"dismissed \(.number)"'
            done
          done
