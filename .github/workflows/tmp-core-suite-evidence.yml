name: tmp core suite evidence

on:
  push:
    branches: ["tmp/core-suite-evidence-17c2173"]

permissions:
  contents: read

jobs:
  core-main-windows:
    name: Core suite at main (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fa02ac6153802301785900139b3196b32c7982f
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build -w kaal-hosting
      - run: npm test -w kaal-core
