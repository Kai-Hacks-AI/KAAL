name: tmp core suite evidence

on:
  push:
    branches: ["tmp/core-suite-evidence-17c2173"]

permissions:
  contents: read

jobs:
  suite:
    name: Core full source suite on Windows at kaal/core 57ae58c
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 57ae58c
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build -w kaal-hosting
      - run: npm test -w kaal-core
