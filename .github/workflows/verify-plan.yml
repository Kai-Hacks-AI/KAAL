# verify Plan (release/C1, engineering/release-management, A5 actions and A6 check job): a detective control on
# PLAN pull requests. The judgment is KAAL's (engineering/release-management/05-src/plan); this workflow is
# only the GitHub adapter that supplies the facts and reports the result as this job's own status.
#
# It runs in `pull_request` with a read-only token and no secrets, because it runs the pull request's own red
# Cases, which are code of the candidate. The judge and the runner are taken from the target branch (`tool/`),
# never from the pull request, so a PLAN cannot edit what judges it; only the plan and its Cases come from the
# pull request (`plan/`). While the target branch holds no judge yet, the job fails: UNKNOWN never passes.
# A pull request that is not a PLAN (title not <capability>/<C-ID> PLAN: ...) is not applicable and passes.
# The capability folder is found from the Change the title names, so every capability is checked.
#
#   pass          PASS, or not applicable (exit 0, 3)
#   fail          FAIL or UNKNOWN (exit 1, 2): the output names each finding and how to recover
name: KAAL

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  verify-plan:
    name: verify Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Applicable?
        id: applicable
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Only a PLAN pull request is judged (title <capability>/<C-ID> PLAN: <concern>); anything else is not applicable and passes.
          if [[ "$PR_TITLE" =~ ^[a-z][a-z0-9-]*/C[0-9]+\ PLAN:\  ]]; then echo "plan=true" >> "$GITHUB_OUTPUT"; else echo "Not applicable: the title is not <capability>/<C-ID> PLAN: <concern>."; fi

      - name: Check out the judge from the target branch
        if: steps.applicable.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false

      - name: Check out the plan from the pull request
        if: steps.applicable.outputs.plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plan
          persist-credentials: false

      - if: steps.applicable.outputs.plan == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read the pull request
        if: steps.applicable.outputs.plan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          commits="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[] | {sha: .sha, message: .commit.message, parents: [.parents[].sha]}' | jq -s .)"
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | {filename: .filename, status: .status}' | jq -s .)"
          jq -n --arg title "$PR_TITLE" --arg body "$PR_BODY" --argjson commits "$commits" --argjson files "$files" \
            '{title: $title, body: $body, commits: $commits, files: $files}' > "$RUNNER_TEMP/pr.json"

      - name: Judge the plan
        if: steps.applicable.outputs.plan == 'true'
        run: |
          node tool/engineering/release-management/05-src/plan/check.mjs --pr "$RUNNER_TEMP/pr.json" --repo plan --execute || status=$?
          case "${status:-0}" in
            0|3) exit 0 ;;
            *) exit 1 ;;
          esac
