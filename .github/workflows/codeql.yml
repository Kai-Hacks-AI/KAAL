# CodeQL security analysis for every pull request into main and kaal/*,
# every push to them, and weekly. Default setup only covers main, so the
# collectors need this advanced workflow. Merge enforcement (required
# Analyze checks and the code scanning rule) lives in the rulesets.
name: CodeQL

on:
  push:
    branches: [main, "kaal/**"]
  pull_request:
    branches: [main, "kaal/**"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
