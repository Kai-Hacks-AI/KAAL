# CodeQL security analysis for every pull request into main and kaal/*,
# every push to them, and weekly. Default setup only covers main, so the
# collectors need this advanced workflow. Merge enforcement (required
# checks and the code scanning rule) lives in the rulesets.
name: CodeQL

on:
  push:
    branches: [main, "kaal/**"]
  pull_request:
    branches: [main, "kaal/**"]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  # Transitional: the rulesets still require the former check names
  # Analyze (actions) and Analyze (javascript-typescript). These jobs run no
  # analysis; each passes only when every CodeQL analysis above succeeded.
  # They are removed once the rulesets require the CodeQL (...) names.
  analyze-compatibility:
    name: Analyze (${{ matrix.language }})
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Require the CodeQL analyses to have succeeded
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.analyze.result }}
