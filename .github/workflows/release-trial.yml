# TRIAL ONLY (do not merge): exercises release.yml (engineering/C14) from a pull request, as the Owner's
# review 6545121413 on #723 asks. Publish cannot run here: it requires workflow_dispatch on the default
# branch and the npm environment.
#   dry-run      step pack, no publish: Pack, bind, the two named artifacts.
#   registry     step registry, run = this run: Pack and Publish skipped, Accept runs and reads the
#                record of the Pack above by run id. Foundation is not on npm, so Accept ends unknown
#                (exit 2) at the registry, after the identity check.
#   wrong        step registry with another package's name: Accept refuses the record's identity.
name: Release trial
# Run 3: engine at #722 415120d, plus the Publish download layout.

on:
  pull_request:
    paths: [.github/workflows/release-trial.yml]

# A called workflow may request no more than its caller grants. release.yml's Publish job declares
# id-token: write, so the caller must allow it, although Publish never runs here (it requires
# workflow_dispatch on the default branch, and the npm environment).
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  dry-run:
    uses: ./.github/workflows/release.yml
    with:
      package: "@kaihacksai/kaal-foundation"
      step: pack
  registry:
    needs: dry-run
    uses: ./.github/workflows/release.yml
    with:
      package: "@kaihacksai/kaal-foundation"
      step: registry
      run: ${{ github.run_id }}
  wrong:
    needs: dry-run
    uses: ./.github/workflows/release.yml
    with:
      package: "@kaihacksai/kaal-guard"
      step: registry
      run: ${{ github.run_id }}
  # Publish's download step, the same action, pin, names and layout, outside the npm environment: the
  # tarball by its name lands at in/tarball/<name> with the record's SHA-256.
  publish-download:
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaihacksai-kaal-foundation-0.0.1.tgz
          path: ${{ runner.temp }}/in/tarball
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release.json
          path: ${{ runner.temp }}/in/record
      - run: |
          ls -laR "$RUNNER_TEMP/in"
          t="$RUNNER_TEMP/in/tarball/kaihacksai-kaal-foundation-0.0.1.tgz"; r="$RUNNER_TEMP/in/record/release.json"
          want="$(node -p 'require(process.argv[1]).sha256' "$r")"; got="$(sha256sum "$t" | cut -d' ' -f1)"
          echo "record $want"; echo "download $got"
          [ "$want" = "$got" ]
