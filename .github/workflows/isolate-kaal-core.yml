name: isolate-kaal-core
on:
  pull_request:
jobs:
  isolate-kaal-core:
    name: isolate-kaal-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change involving packages/kaal-core/** may not also change anything else
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed" | grep -q '^packages/kaal-core/' || exit 0
          outside=$(echo "$changed" | grep -v '^packages/kaal-core/' || true)
          [ -z "$outside" ] && exit 0
          echo "This change involves packages/kaal-core/** and also changes:"
          echo "$outside"
          exit 1
