name: kaal-core controls

on: pull_request

permissions:
  contents: read

# One job per control. The job id is also the job's display name, and the
# display name is the check name GitHub reports. Branch protection requires
# these names: test-kaal, check-kaal-seals, isolate-boundaries, preserve-sealed-changes
# and admit-lineage (the lineage branches kaal/* only).
# preserve-seals is reported too but is not (yet) a required check.
jobs:
  # KAAL controls: portable, they work without Git.
  test-kaal:
    name: test-kaal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  check-kaal-seals:
    name: check-kaal-seals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-kaal-seals

  # Git controls: history and change-set policy around Core.
  isolate-boundaries:
    name: isolate-boundaries
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the isolation script
        run: .github/scripts/isolate-boundaries.test.sh
      - run: .github/scripts/isolate-boundaries.sh "$TARGET"

  preserve-seals:
    name: preserve-seals
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/preserve-seals.sh "$TARGET"

  # Closed Changes stay closed: asks the repository's own command which are sealed.
  preserve-sealed-changes:
    name: preserve-sealed-changes
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test the control
        run: .github/scripts/preserve-sealed-changes.test.sh
      - run: .github/scripts/preserve-sealed-changes.sh "$TARGET"

  # Admission: a pull request into a lineage branch introduces exactly one new Change, and it is closed.
  # Other branches are staging, where nothing is admitted, so the job is skipped there.
  admit-lineage:
    name: admit-lineage
    if: startsWith(github.base_ref, 'kaal/')
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test the control
        run: .github/scripts/admit-lineage.test.sh
      - run: .github/scripts/admit-lineage.sh "$TARGET"
