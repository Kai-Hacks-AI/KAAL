name: kaal-core controls

on: pull_request

permissions:
  contents: read

# One job per control. The job id is also the job's display name, and the
# display name is the check name GitHub reports. Branch protection requires
# these names: test-kaal, check-kaal-seals, isolate-boundaries, preserve-sealed-changes.
# contain-change is reported for kaal/* proposals and becomes required only when the
# owner adds it to the lineage ruleset.
# preserve-seals is reported too but is not (yet) a required check.
jobs:
  # KAAL controls: portable, they work without Git.
  test-kaal:
    name: test-kaal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  check-kaal-seals:
    name: check-kaal-seals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-kaal-seals

  # Git controls: history and change-set policy around Core. The workflow only
  # invokes the kaal-github Extension; it knows no process semantics.
  isolate-boundaries:
    name: isolate-boundaries
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build --prefix packages/kaal-github
      - run: node packages/kaal-github/dist/cli.js isolate-boundaries "$TARGET"

  preserve-seals:
    name: preserve-seals
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build --prefix packages/kaal-github
      - run: node packages/kaal-github/dist/cli.js preserve-seals "$TARGET"

  # Closed Changes stay closed.
  preserve-sealed-changes:
    name: preserve-sealed-changes
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build --prefix packages/kaal-github
      - run: node packages/kaal-github/dist/cli.js preserve-sealed-changes "$TARGET"

  # Containment: the proposal into a lineage branch contains exactly one new closed Change and keeps closed history intact.
  # Other branches are staging, where nothing is admitted, so the job is skipped there.
  contain-change:
    name: contain-change
    if: startsWith(github.base_ref, 'kaal/')
    runs-on: ubuntu-latest
    env:
      TARGET: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build --prefix packages/kaal-github
      - run: node packages/kaal-github/dist/cli.js contain-change "$TARGET"
