# Enforces Change Isolation (engineering/change-isolation) on pull requests: Core travels alone,
# .github travels alone. The rules live only in the checker; this job runs KAAL's Change-Isolation check
# (guard.json, engineering/github/change-isolation.sh) through kaal-guard and supplies its facts.
#
# pull_request_target runs this workflow, and the commit it checks out, as they stand on the default
# branch, never as the candidate PR has them. The job checks out the default branch, which holds
# kaal-guard and KAAL's scripts, and installs them from there. Only the checker held by the PR's target
# branch at its current tip is executed, read from Git; the event's base.sha is not used, as it is
# recorded when the PR last changed and can predate the target. The candidate's commits are fetched as
# git data to list its changed paths and are never checked out, built, installed or run. A target that
# does not hold the checker cannot be judged, which fails: the check passes only on a judgment or a
# synchronization.
#
# Synchronization: a candidate head already contained in the default branch carries only Changes
# that were each admitted there. Such a main -> kaal/* synchronization is expected not to travel
# alone, so Change Isolation does not apply to its aggregate. This needs no checker, so a target that
# lacks it can still receive it from the default branch.
#
# A synchronization of an existing kaal/* lineage brings the default branch's admitted Changes and
# keeps the lineage's own; its Change is only its explicit resolutions. The branching checker
# (engineering/github/lineage.ts, as the default branch holds it) verifies the synchronization and
# names those paths, and only they are judged here. A candidate it does not verify is an ordinary
# Change, judged whole; Branching reports what is wrong with it.
name: Change Isolation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  change-isolation:
    name: Change Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      # The fetch is unauthenticated: this repository is public. If it ever goes private, this fails closed.
      - name: Read the target's current tip
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE=$(git rev-parse --verify "origin/$BASE_REF^{commit}") || {
            echo "::error title=Change Isolation: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Judge the complete change against the target
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
        run: npx --no kaal-guard run --check Change-Isolation --github --head "$HEAD" --base "$BASE" --base-ref "$BASE_REF"
