# Enforces Change Isolation (engineering/change-isolation) on pull requests: Core travels alone,
# .github travels alone. The rules live only in the checker; this workflow supplies the change set.
#
# pull_request_target runs this workflow as it stands on the default branch, never as the candidate
# PR has it. Only the checker held by the PR's target branch at its current tip is executed; the
# event's base.sha is not used, as it is recorded when the PR last changed and can predate the
# target. The candidate's commits are fetched as git data to list its changed paths and are never
# checked out, built, installed or run. Activation: nothing runs until this workflow is on the
# default branch. Once it runs, a target that does not hold the checker fails: the check passes
# only on a judgment or a synchronization.
#
# Synchronization: a candidate whose merge into a kaal/* target delivers exactly the clean merge of
# the default branch's current tip into that target carries only Changes that were each admitted
# there. So does a candidate head already contained in the default branch. Such a default -> kaal/*
# synchronization is expected not to travel alone, so Change Isolation does not apply to its
# aggregate. Any content the default branch does not hold, a conflict resolution included, makes the
# candidate an ordinary Change, judged as usual. This needs no checker, so a target that lacks it can
# still receive it from the default branch.
name: Change Isolation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  change-isolation:
    name: Change Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The fetch is unauthenticated: this repository is public. If it ever goes private, this fails closed.
      - name: Judge the complete change against the target
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          BASE=$(git rev-parse HEAD)
          git fetch --no-tags origin "$HEAD"
          merged() { local out; out=$(git merge-tree --write-tree --no-messages "$1" "$2" 2>/dev/null) && echo "${out%%$'\n'*}"; }
          if git merge-base --is-ancestor "$HEAD" "origin/$DEFAULT"; then
            echo "Synchronization: Change Isolation not applicable; candidate $HEAD already admitted on $DEFAULT."
            exit 0
          fi
          if [[ "$BASE_REF" == kaal/* ]] \
            && SYNC=$(merged "$BASE" "origin/$DEFAULT") && [ "$(merged "$BASE" "$HEAD")" = "$SYNC" ]; then
            echo "Synchronization: Change Isolation not applicable; merging $HEAD delivers exactly $DEFAULT's current state into $BASE_REF."
            exit 0
          fi
          if [ ! -f engineering/change-isolation/check.mjs ]; then
            echo "::error::not verified: the target does not hold engineering/change-isolation/check.mjs"
            exit 1
          fi
          git diff --no-ext-diff --no-relative --no-renames --name-only -z --end-of-options "$BASE...$HEAD" \
            | node engineering/change-isolation/check.mjs
