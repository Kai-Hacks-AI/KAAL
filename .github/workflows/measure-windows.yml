name: Measure
on:
  pull_request:
    paths: [".github/measure/**", ".github/workflows/measure-windows.yml"]
permissions:
  contents: read
jobs:
  measure:
    name: Measure (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: Windows, os: windows-latest }
          - { host: Linux, os: ubuntu-latest }
          - { host: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build -w @kaihacksai/kaal-hosting
      - run: node .github/measure/measure.mjs
        shell: bash
