# Release (engineering/C14, the adapter of engineering/C12's Release engine, engineering/release/README.md):
# releases any KAAL package to npm. All judgment is the engine's (engineering/release/run.mjs); this file
# supplies facts and acts on exit statuses: 0 verified, 1 failed, 2 cannot judge.
#
# The Owner starts it by hand (workflow_dispatch). It is also callable (workflow_call; a called run sees the
# caller's event, so "called" is any event but workflow_dispatch), so that a trial can
# exercise Pack and Accept from a pull request. Publish never runs except from the default branch,
# dispatched, with `publish`, after the `npm` environment's approval.
#
#   step: pack      Readiness, source tests, ONE pack, installed verification, the release record. With
#                   `publish` and a package npm already knows, Publish then downloads the tested tarball
#                   and publishes those bytes through Trusted Publishing (no repack, no token), and Accept
#                   checks the registry. A package npm does not know yet is a first publication: the
#                   summary gives the Owner's download, verify and publish steps (F34).
#   step: registry  Accept only (F35), of the Pack run `run`: its bound record and the registry's bytes, a
#                   fresh registry install and provenance. Publishes nothing. Pack and Publish are skipped,
#                   and Accept uses neither job's outputs: it reads everything from run `run`'s artifacts.
#
# Artifacts, by explicit name, each one file, uploaded unzipped (archive: false) so its digest is the
# file's SHA-256:
#   <tarball>       the tested tarball, named as npm packed it (<scope>-<name>-<version>.tgz). The one
#                   release artifact: Publish publishes these bytes, the Owner downloads them for F34.
#   release.json    the release record, bound by the engine to this run, this commit and the tarball
#                   artifact's id and digest.
# Each download goes to its own directory, and the step after it checks the exact path and the bytes.
#
# Owner prerequisites, outside this file: the `npm` environment with the Owner as required reviewer,
# restricted to the default branch (it exists, from Guard Release); for each package, after its first
# publication, its trusted publisher set to Kai-Hacks-AI/KAAL, workflow release.yml, environment npm.
#
# Linux only: the commit's CI already ran the package's suites on Linux, Windows and macOS (N17).
name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package's npm name, e.g. @kaihacksai/kaal-foundation
        type: string
        required: true
      step:
        description: pack (and publish, if asked), or registry (accept a published version)
        type: choice
        options: [pack, registry]
        default: pack
      publish:
        description: With pack, publish through Trusted Publishing after the npm environment's approval
        type: boolean
        default: false
      run:
        description: With registry, the id of the Pack run whose release record to accept
        type: string
        default: ""
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      step:
        type: string
        default: pack
      run:
        type: string
        default: ""

permissions:
  contents: read

env:
  # One npm for the pack and the registry download, so SHA-256s compare like with like (N16), and at or
  # above Trusted Publishing's 11.5.1. The same version the Owner uses for a first publication (F34).
  NPM_VERSION: 11.21.0
  RECORD: release.json

jobs:
  pack:
    name: Pack
    if: inputs.step == 'pack' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      path: ${{ steps.pack.outputs.path }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global "npm@$NPM_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-hosting
      - id: pack
        name: Pack (engine)
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          out="$RUNNER_TEMP/release"
          set +e
          node engineering/release/run.mjs pack --package "$PACKAGE" --out "$out" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          status=$?
          set -e
          [ -f "$out/report/summary.md" ] && cat "$out/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          tarball="$(node -p 'require(process.argv[1]).tarball' "$out/record/$RECORD")"
          [ -f "$out/artifact/$tarball" ] || { echo "::error title=Release: cannot judge::$out/artifact/$tarball is missing"; exit 2; }
          echo "path=$(node -p 'require(process.argv[1]).path' "$out/record/$RECORD")" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # The tested tarball's exact bytes, unzipped: the one release artifact (F31), named as its file.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.tarball }}
          path: ${{ runner.temp }}/release/artifact/${{ steps.pack.outputs.tarball }}
          archive: false
          if-no-files-found: error
      - name: Bind the artifact to the record (engine)
        env:
          ID: ${{ steps.upload.outputs.artifact-id }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          node engineering/release/run.mjs bind --record "$RUNNER_TEMP/release/record/$RECORD" --id "$ID" --digest "$DIGEST" --out "$RUNNER_TEMP/release/bound"
          echo "Artifact \`${{ steps.pack.outputs.tarball }}\` (the exact bytes, digest \`$DIGEST\`): $URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release.json
          path: ${{ runner.temp }}/release/bound/release.json
          archive: false
          if-no-files-found: error
      - name: The run holds exactly the two named artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[].name] | sort | join(" ")')"
          want="$(printf '%s\n' "$TARBALL" "$RECORD" | sort | tr '\n' ' ' | sed 's/ $//')"
          echo "artifacts: $names"
          [ "$names" = "$want" ] || { echo "::error title=Release: cannot judge::artifacts are '$names', expected '$want'"; exit 2; }

  publish:
    name: Publish
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.pack.outputs.path == 'trusted' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global "npm@$NPM_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-hosting
      # Pack's two artifacts from this run, by name, each into its own directory. Nothing is packed here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pack.outputs.tarball }}
          path: ${{ runner.temp }}/in/tarball
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release.json
          path: ${{ runner.temp }}/in/record
      - name: Publish the tested tarball (engine)
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          t="$RUNNER_TEMP/in/tarball/$TARBALL"; r="$RUNNER_TEMP/in/record/$RECORD"
          [ -f "$t" ] && [ -f "$r" ] || { echo "::error title=Release: cannot judge::expected $t and $r"; ls -laR "$RUNNER_TEMP/in"; exit 2; }
          node engineering/release/run.mjs publish --record "$r" --tarball "$t" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"

  accept:
    name: Accept
    needs: [pack, publish]
    # always(): with step registry, Pack and Publish are skipped and Accept must still run. It reads no
    # output of either job, only run RUN's artifacts.
    if: always() && (needs.publish.result == 'success' || (inputs.step == 'registry' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RUN: ${{ inputs.step == 'registry' && inputs.run || github.run_id }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global "npm@$NPM_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-hosting
      - name: The run to accept is named
        run: |
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "::error title=Release: cannot judge::no Pack run id to accept (input run)"; exit 2; }
      # The bound record of Pack run RUN, by name, into its own directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release.json
          path: ${{ runner.temp }}/in/record
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}
      - name: Accept from the registry (engine)
        run: |
          r="$RUNNER_TEMP/in/record/$RECORD"
          [ -f "$r" ] || { echo "::error title=Release: cannot judge::expected $r"; ls -laR "$RUNNER_TEMP/in"; exit 2; }
          got="$(node -p 'const r=require(process.argv[1]); r.package+" "+r.run' "$r")"
          [ "$got" = "$PACKAGE $RUN" ] || { echo "::error title=Release: cannot judge::run $RUN's record is '$got', not '$PACKAGE $RUN'"; exit 2; }
          echo "Accepting $PACKAGE from Pack run $RUN"
          set +e
          node engineering/release/run.mjs accept --record "$r" --run "$RUN" --out "$RUNNER_TEMP/accept"
          status=$?
          set -e
          [ -f "$RUNNER_TEMP/accept/report/summary.md" ] && cat "$RUNNER_TEMP/accept/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
