# Promotion Source: runs KAAL's Promotion-Source check (guard.json, engineering/github/promotion-source.sh)
# through kaal-guard, on where a pull request comes from. The verdict and its guidance live only in the
# branching checker, engineering/github/lineage.ts, and engineering/github/branching.md; a pull request
# into any branch but the default is not applicable.
#
# This is a provider-side promotion gate, separate from Change Isolation's changed-path judgment.
# pull_request_target runs this workflow, and the commit it checks out, as they stand on the default
# branch; the job checks out the default branch, which holds kaal-guard and KAAL's scripts, and
# kaal-guard takes the checker from its tip (trusted). Only the event's refs are judged: nothing of
# the candidate is fetched, checked out or run. It runs on every pull request so that, once required,
# it reports on every one.
name: KAAL

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  promotion-source:
    name: Promotion Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Judge the source with the default branch's checker
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_REPO: ${{ github.repository }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
          KAAL_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          KAAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npx --no kaal-guard run --check Promotion-Source --github --base "$(git rev-parse HEAD)" --base-ref "$BASE_REF"
