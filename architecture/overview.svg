<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 840" width="1220" height="840" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">KAAL conceptual architecture overview</title>
  <desc id="d">Target architecture in three columns. The Agent thinks and acts across KAAL. KAAL holds BRAIN, Core, Skills, Extensions and Processes, reachable in Engineer, Embed and External modes. The Agent works across the Six Ds: Describe Intent, Define Requirements, Design Architecture, Develop Code, Do IT, Detect Defects, framed by Destination, Discovery and Defence. Dashed outlines mark what is an emerging requirement. This is an architectural projection, not an inventory of implemented capabilities.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/>
    </marker>
    <style>
      .col { fill:#f6f8fa; stroke:#c5ced6; stroke-width:1.5 }
      .box { fill:#ffffff; stroke:#8a98a6; stroke-width:1.5 }
      .core { fill:#e8eef4; stroke:#2f4a63; stroke-width:2 }
      .emerging { fill:#ffffff; stroke:#8a98a6; stroke-width:1.5; stroke-dasharray:6 4 }
      .pill { fill:#ffffff; stroke:#5b6b7a; stroke-width:1.5 }
      .h { font-size:26px; font-weight:700; fill:#1f2d3a }
      .sub { font-size:15px; fill:#4a5a6a }
      .n { font-size:19px; font-weight:700; fill:#1f2d3a }
      .s { font-size:14px; fill:#4a5a6a }
      .num { font-size:16px; font-weight:700; fill:#2f4a63 }
      .frame { font-size:13px; font-weight:700; letter-spacing:0.5px; fill:#2f4a63 }
      .note { font-size:14px; fill:#4a5a6a }
      .arrow { stroke:#5b6b7a; stroke-width:2; fill:none }
    </style>
  </defs>
  <rect width="1220" height="840" fill="#ffffff"/>

  <!-- Agent -->
  <rect class="col" x="40" y="40" width="260" height="660" rx="14"/>
  <text class="h" x="170" y="86" text-anchor="middle">Agent</text>
  <text class="sub" x="170" y="112" text-anchor="middle">Thinks and acts across KAAL</text>
  <rect class="box" x="64" y="140" width="212" height="120" rx="10"/>
  <text class="n" x="170" y="176" text-anchor="middle">The actor</text>
  <text class="s" x="170" y="202" text-anchor="middle">Reasons, decides, acts.</text>
  <text class="s" x="170" y="222" text-anchor="middle">Remains the actor; KAAL</text>
  <text class="s" x="170" y="242" text-anchor="middle">never replaces it.</text>
  <text class="s" x="170" y="300" text-anchor="middle">Lives outside KAAL's persistent</text>
  <text class="s" x="170" y="320" text-anchor="middle">knowledge and capabilities.</text>
  <text class="s" x="170" y="360" text-anchor="middle">KAAL persists independently of</text>
  <text class="s" x="170" y="380" text-anchor="middle">any agent, provider, model</text>
  <text class="s" x="170" y="400" text-anchor="middle">or context window.</text>

  <!-- Agent <-> KAAL -->
  <path class="arrow" d="M302 370 L358 370" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- KAAL -->
  <rect class="col" x="360" y="40" width="480" height="660" rx="14"/>
  <text class="h" x="600" y="86" text-anchor="middle">KAAL</text>
  <text class="sub" x="600" y="112" text-anchor="middle">The Agent's persistent knowledge and capabilities</text>

  <rect class="box" x="384" y="132" width="432" height="86" rx="10"/>
  <text class="n" x="600" y="162" text-anchor="middle">BRAIN</text>
  <text class="s" x="600" y="186" text-anchor="middle">Persistent learning and</text>
  <text class="s" x="600" y="206" text-anchor="middle">bounded knowledge navigation</text>

  <rect class="core" x="384" y="234" width="432" height="104" rx="10"/>
  <text class="n" x="600" y="264" text-anchor="middle">Core</text>
  <text class="s" x="600" y="288" text-anchor="middle">Node and Edge semantics, identity, type</text>
  <text class="s" x="600" y="308" text-anchor="middle">and deterministic operations, including admission</text>

  <rect class="box" x="384" y="354" width="208" height="118" rx="10"/>
  <text class="n" x="488" y="384" text-anchor="middle">Skills</text>
  <text class="s" x="488" y="408" text-anchor="middle">Ways of Working</text>
  <text class="s" x="488" y="428" text-anchor="middle">Sealing is an</text>
  <text class="s" x="488" y="448" text-anchor="middle">independent Skill</text>

  <rect class="box" x="608" y="354" width="208" height="118" rx="10"/>
  <text class="n" x="712" y="384" text-anchor="middle">Extensions</text>
  <text class="s" x="712" y="408" text-anchor="middle">Additional capabilities</text>
  <text class="s" x="712" y="428" text-anchor="middle">that join KAAL</text>
  <text class="s" x="712" y="448" text-anchor="middle">without becoming Core</text>

  <rect class="emerging" x="384" y="488" width="432" height="116" rx="10"/>
  <text class="n" x="600" y="518" text-anchor="middle">Processes</text>
  <text class="s" x="600" y="542" text-anchor="middle">Specialized Skills that compose capabilities</text>
  <text class="s" x="600" y="562" text-anchor="middle">and establish governed agency</text>
  <text class="s" x="600" y="588" text-anchor="middle">Deterministic grants, denials and escalation: emerging</text>

  <text class="frame" x="600" y="632" text-anchor="middle">OPERATING MODES</text>
  <rect class="pill" x="392" y="644" width="130" height="38" rx="19"/>
  <text class="n" x="457" y="669" text-anchor="middle">Engineer</text>
  <rect class="pill" x="535" y="644" width="130" height="38" rx="19"/>
  <text class="n" x="600" y="669" text-anchor="middle">Embed</text>
  <rect class="pill" x="678" y="644" width="130" height="38" rx="19"/>
  <text class="n" x="743" y="669" text-anchor="middle">External</text>

  <!-- KAAL -> Six Ds -->
  <path class="arrow" d="M842 370 L888 370" marker-end="url(#a)"/>

  <!-- Six Ds -->
  <rect class="col" x="890" y="40" width="290" height="660" rx="14"/>
  <text class="h" x="1035" y="86" text-anchor="middle">Six Ds</text>
  <text class="frame" x="1035" y="112" text-anchor="middle">DESTINATION · DISCOVERY · DEFENCE</text>
  <g>
    <rect class="box" x="914" y="132" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="174">1</text>
    <text class="n" x="958" y="174">Describe Intent</text>
    <rect class="box" x="914" y="216" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="258">2</text>
    <text class="n" x="958" y="258">Define Requirements</text>
    <rect class="box" x="914" y="300" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="342">3</text>
    <text class="n" x="958" y="342">Design Architecture</text>
    <rect class="box" x="914" y="384" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="426">4</text>
    <text class="n" x="958" y="426">Develop Code</text>
    <rect class="box" x="914" y="468" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="510">5</text>
    <text class="n" x="958" y="510">Do IT</text>
    <rect class="box" x="914" y="552" width="242" height="72" rx="10"/>
    <text class="num" x="934" y="594">6</text>
    <text class="n" x="958" y="594">Detect Defects</text>
  </g>
  <text class="s" x="1035" y="660" text-anchor="middle">What the Agent works on</text>
  <text class="s" x="1035" y="680" text-anchor="middle">through KAAL</text>

  <!-- Legend and status -->
  <rect class="emerging" x="40" y="728" width="44" height="22" rx="5"/>
  <text class="note" x="96" y="744">Dashed: emerging requirement, not an implemented guarantee</text>
  <text class="note" x="40" y="784">Target architecture, not an inventory of implemented capabilities. Not a source of truth:</text>
  <text class="note" x="40" y="804">the established Nodes and their definitions in .kaal/ are. See architecture/overview.md.</text>
</svg>
