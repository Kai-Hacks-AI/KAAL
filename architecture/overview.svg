    <text class="dn" x="652" y="325">D4</text>
    <text class="dt" x="652" y="349">Develop Code</text>
    <rect fill="#eff3fd" x="642" y="377" width="266" height="62" rx="12"/>
    <text class="dn" x="652" y="398">D5</text>
    <text class="dt" x="652" y="422">Do IT</text>
    <rect fill="#eff3fd" x="642" y="449" width="266" height="62" rx="12"/>
    <text class="dn" x="652" y="470">D6</text>
    <text class="dt" x="652" y="494">Detect Defects</text>
  <text class="f" x="775" y="537" text-anchor="middle">Destination · Discovery · Defence</text>

  <text class="note" x="17" y="598">Target architecture, not an inventory of implemented capabilities: Processes, BRAIN and the operating modes are not yet established.</text>
  <text class="note" x="17" y="618">An architectural projection, not a source of truth. The Nodes in .kaal/ are. See architecture/overview.md.</text>
</svg>
