name: inspector
# review/C6. Judges the controls registered at the station and signs one check per control. The judge job holds no secret; only the sign job names the key.
on:
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]
permissions: {}
jobs:
  judge:
    name: judge Controls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
    steps:
      - name: Check out the base, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the proposed head as Git data
        run: |
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            git fetch --no-tags origin "+${MERGE_GROUP_HEAD_REF}:refs/remotes/pull/head"
          else
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          fi
          test "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_SHA"
      - name: Judge the controls registered at the station
        run: node packages/kaal-controls/skills/kaal-controls/scripts/judge.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --run "$GITHUB_RUN_ID" --out verdicts.json
      - name: Keep the verdicts as data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdicts
          path: verdicts.json
  sign:
    name: sign Controls
    needs: judge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - name: Check out the base, never the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
      - name: Take the verdicts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdicts
      - name: Post one check per control
        env:
          INSPECTOR_PRIVATE_KEY: ${{ secrets.INSPECTOR_PRIVATE_KEY }}
        run: node packages/kaal-controls/skills/kaal-controls/scripts/sign.mjs --verdicts verdicts.json --revision "$HEAD_SHA" --run "$GITHUB_RUN_ID"
