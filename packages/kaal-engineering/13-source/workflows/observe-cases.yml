# The observation hold Act reads (engineering C38, on release C135's split and Testing C82's `observe-at`). A reusable workflow, called by a job of the controls ACT workflow on a pull request into a collector.
# Two jobs, so the step that runs candidate code is not the step that writes the evidence: run-cases runs the carried Cases with Testing of the default branch and uploads the run report only;
# observe-cases runs no candidate code, reads that report as untrusted data and writes the observation. Read-only, no secret, no credentials kept. Tool and judge come from the default branch,
# the merge result of the pull request only as data. The observation says it was produced by the pull request: evidence of its own CI, not proof, and a forged verdict in a well-formed report is not detected.
name: observe Cases

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-cases:
    name: run Cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, Testing and the lister
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-core -w @kaihacksai/kaal-hosting
      - name: Check out the merge result, as the tree whose Cases run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          persist-credentials: false
      - name: List the Cases of the carried Changes, then run them with Testing of the default branch
        run: |
          node engineering/release-management/05-src/phase/list-carried-cases.mjs --main . --pr pr > cases.txt
          if [ -s cases.txt ]; then
            node packages/kaal-testing/bin/kaal-testing.mjs run --root "$GITHUB_WORKSPACE/pr" $(cat cases.txt) > run-report.json
          else
            echo '{}' > run-report.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-report
          path: run-report.json
          retention-days: 1

  observe-cases:
    name: observe Cases
    needs: run-cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, Testing and the lister
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-core -w @kaihacksai/kaal-hosting
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-report
      - name: Observe the Cases at the revision of the merge result
        env:
          OBSERVED_REVISION: ${{ github.sha }}
          OBSERVED_RUN: ${{ github.run_id }}
        run: |
          node engineering/release-management/05-src/phase/list-carried-cases.mjs --main . --pr pr > cases.txt
          if [ -s cases.txt ]; then
            node packages/kaal-testing/bin/kaal-testing.mjs observe-at --report run-report.json --root "$GITHUB_WORKSPACE/pr" --revision "$OBSERVED_REVISION" --expect-revision "$OBSERVED_REVISION" --run-id "$OBSERVED_RUN" --produced-by pull-request --out observation $(cat cases.txt)
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation
          path: observation/observation.json
          if-no-files-found: ignore
          retention-days: 1
