name: verify Workflow names
# release/CTL36. A check on plain pull_request and merge_group: no token, no secret. It runs the judge of the base and reads the change only as Git data.
on:
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  verify-workflow-names:
    name: verify Workflow names
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
    steps:
      - name: Check out the base, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the proposed head as Git data
        run: |
          if [ -n "$MERGE_GROUP_HEAD_REF" ]; then
            git fetch --no-tags origin "+${MERGE_GROUP_HEAD_REF}:refs/remotes/pull/head"
          else
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          fi
          git worktree add --detach "$RUNNER_TEMP/head" refs/remotes/pull/head
      - name: Judge the names
        run: |
          J=engineering/release-management/05-src/workflow-names/judge-workflow-names.mjs
          test -f "$J" || { echo "UNKNOWN: the judge is absent on the base"; exit 2; }
          node "$J" --head "$RUNNER_TEMP/head" --out "$RUNNER_TEMP/findings.json"
      - name: Judge the findings against the accepted baseline
        run: node packages/kaal-controls/skills/kaal-controls/scripts/judge-mode.mjs --mode ratchet --findings "$RUNNER_TEMP/findings.json" --baseline "$RUNNER_TEMP/head/engineering/release-management/04-controls/CTL36-verify-workflow-names/baseline.json" --previous engineering/release-management/04-controls/CTL36-verify-workflow-names/baseline.json
