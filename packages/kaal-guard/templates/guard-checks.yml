name: Guard
# Written by kaal-guard init. It runs as a job of its own each ci check declared in .kaal/config/guard/
# that no workflow job declares by name; another workflow runs kaal-guard verify. While it is unmodified,
# kaal-guard upgrade moves it to the installed version's content; once you change it, it is yours.
on:
  pull_request:
permissions:
  contents: read
jobs:
  list:
    name: Guard checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - id: list
        run: npx --no kaal-guard list --undeclared --config .kaal/config/guard --github
  check:
    name: ${{ matrix.check }}
    needs: list
    if: needs.list.outputs.checks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: git diff --name-only -z ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > "$RUNNER_TEMP/changed"
      - run: npx --no kaal-guard run --check ${{ matrix.check }} --config .kaal/config/guard --github --head ${{ github.event.pull_request.head.sha }} --base ${{ github.event.pull_request.base.sha }} --base-ref ${{ github.base_ref }} --changed ${{ runner.temp }}/changed
