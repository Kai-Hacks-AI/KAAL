name: Guard
# Written by kaal-guard init --ci, because you asked for it: the Guard job runs kaal-guard verify, and the
# Guard checks job runs every ci check declared in .kaal/config/guard/. While it is unmodified, kaal-guard
# upgrade moves it to the installed version's content; once you change it, it is yours.
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no kaal-guard verify --config .kaal/config/guard --github
  checks:
    name: Guard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/changed"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: npx --no kaal-guard run --ci --config .kaal/config/guard --github --head "$HEAD" --base "$BASE" --base-ref "$BASE_REF" --changed "$RUNNER_TEMP/changed"
