name: Guard
# Written by kaal-guard init --ci, because you asked for it: it runs kaal-guard verify, and runs every ci
# check declared in .kaal/config/guard/ in one job. While it is unmodified, kaal-guard upgrade moves it
# to the installed version's content; once you change it, it is yours.
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx --no kaal-guard verify --config .kaal/config/guard --github
  checks:
    name: Guard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: git diff --name-only -z ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > "$RUNNER_TEMP/changed"
      - run: npx --no kaal-guard run --ci --config .kaal/config/guard --github --head ${{ github.event.pull_request.head.sha }} --base ${{ github.event.pull_request.base.sha }} --base-ref ${{ github.base_ref }} --changed ${{ runner.temp }}/changed
