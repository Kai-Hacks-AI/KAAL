name: Solution protection
# Written by kaal-guard init --solution, because you asked for it. The plan job lists the checks every package
# registers in its guard.json, each check runs in a job named by its id and writes a report, and the fold job,
# the only name a ruleset requires, passes only on a report of every expected check for this run and revision.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  plan:
    name: Solution plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - id: plan
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          HEAD=$(git rev-parse HEAD)
          npx --no kaal-guard plan --aggregate solution --run "$RUN" --head "$HEAD" --base "$BASE" > plan.json
          echo "matrix=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync("plan.json","utf8")).matrix))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solution-plan
          path: plan.json
  check:
    name: ${{ matrix.check }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - env:
          CHECK: ${{ matrix.check }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npx --no kaal-guard run --ci --check "$CHECK" --run "$RUN" --head "$(git rev-parse HEAD)" --report "reports/$(echo "$CHECK" | sed 's|/|__|g').json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ strategy.job-index }}
          path: reports/
  fold:
    name: Solution protection
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solution-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - run: npx --no kaal-guard fold --aggregate solution --plan plan.json --reports reports --github
