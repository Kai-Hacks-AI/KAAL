# verify Sync (release/C58, release/C65), moved off pull_request_target by release/C173. It runs on plain `pull_request`, holds no
# token and no secret, checks out the default branch as the trusted judge and fetches the candidate as Git data only: nothing of
# the candidate is checked out, built, installed or run (the mechanism of release/C90). The verdict leaves this job as data, in a
# file that names this run, the pull request, the head sha and the base ref (the verdict itself names the base sha it judged). The
# workflow `sync act` takes it from there; this job writes nothing to the pull request.
# This is a source; a WIRE installs it under .github/workflows/ (`.github` travels alone) and retires sync-review.yml in the same step.
name: sync verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  verify:
    name: verify Sync
    if: startsWith(github.event.pull_request.title, 'SYNC:') && (startsWith(github.event.pull_request.base.ref, 'kaal/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'wire/'))
    runs-on: ubuntu-latest
    permissions: {}
    env:
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_BASE: ${{ github.event.pull_request.base.ref }}
      KAAL_HEAD: ${{ github.event.pull_request.head.sha }}
      KAAL_BODY: ${{ github.event.pull_request.body }}
      KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
      KAAL_RUN_ID: ${{ github.run_id }}
      KAAL_VERDICT_FILE: ${{ runner.temp }}/sync-verdict/verdict.json
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Git data only: the candidate's head and the base branch's current tip. The repository is public, so the fetch is unauthenticated.
      - name: Fetch the candidate as Git data
        run: git fetch --no-tags origin "+refs/pull/${KAAL_PR}/head:refs/kaal/pr" "+refs/heads/${KAAL_BASE}:refs/kaal/base"

      - name: Judge the SYNC
        run: |
          mkdir -p "$(dirname "$KAAL_VERDICT_FILE")"
          node engineering/release-management/05-src/sync-review/cli.mjs verify

      # The verdict is uploaded whatever it says: a failing SYNC must still reach a person.
      - name: Hand the verdict on as data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-verdict
          path: ${{ runner.temp }}/sync-verdict/verdict.json
          if-no-files-found: ignore
          retention-days: 3
