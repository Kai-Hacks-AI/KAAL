# verify Sync, approve Sync and review Sync (release/C58), as a source in Engineering: release/CTL7 (detective), release/CTL8
# (preventive) and release/CTL9 (corrective). A pull request into kaal/*, hotfix/* or wire/* is read at its head.
# The jobs run for a pull request into such a base whatever its title (release/C152): `verify Sync` decides from Git whether the head is a SYNC at all, a merge that brings main in, and
# `approve Sync` and `review Sync` act only on a verdict that says it applies. `verify Sync` says whether a SYNC is a pure merge of main and is red when it is not. `approve Sync` approves it only when that
# passes at the current head, never into main, and only when the repository variable KAAL_SYNC_APPROVE is exactly `on`; otherwise
# it says what it would do. `review Sync` puts every other outcome in front of a person: a label, a request for review and one
# comment per head. Nothing here merges, pushes or edits a branch or a body.
#
# pull_request_target runs this workflow from the default branch. release/C65 splits the jobs by what a token can do. `verify Sync`
# holds no token (`permissions: {}`) and is the only job that reads the candidate: it checks out the default branch and fetches the
# candidate's commits as Git data, and nothing of the candidate is checked out, built, installed or run. `approve Sync` and
# `review Sync` can write to the pull request and never fetch the candidate: they take the verdict of verify Sync as data and
# check it against the pull request and the base as GitHub says they are now. A candidate that could change what the code does
# still could not reach a token. Title and body are handed to scripts only as data, never interpolated into a command.
# This is a source; a WIRE installs it under .github/workflows/ (`.github` travels alone), and the repository setting that lets
# Actions approve a pull request is the Owner's.
name: sync review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  verify:
    name: verify Sync
    if: (startsWith(github.event.pull_request.base.ref, 'kaal/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'wire/'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
    env:
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_BASE: ${{ github.event.pull_request.base.ref }}
      KAAL_HEAD: ${{ github.event.pull_request.head.sha }}
      KAAL_BODY: ${{ github.event.pull_request.body }}
      KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Git data only: the candidate's head and the base branch's current tip. The repository is public, so the fetch is unauthenticated.
      - name: Fetch the candidate as Git data
        run: git fetch --no-tags origin "+refs/pull/${KAAL_PR}/head:refs/kaal/pr" "+refs/heads/${KAAL_BASE}:refs/kaal/base"

      - name: Judge the SYNC
        id: verify
        run: node engineering/release-management/05-src/sync-review/cli.mjs verify

  approve:
    name: approve Sync
    needs: verify
    outputs:
      approval: ${{ steps.approve.outputs.approval }}
    if: ${{ always() && (startsWith(github.event.pull_request.base.ref, 'kaal/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'wire/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      KAAL_REPO: ${{ github.repository }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_BASE: ${{ github.event.pull_request.base.ref }}
      KAAL_VERDICT: ${{ needs.verify.outputs.verdict }}
      # Exactly `on` approves; anything else, or nothing, is a dry run that only says what it would do.
      KAAL_SYNC_APPROVE: ${{ vars.KAAL_SYNC_APPROVE }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Approve what verify Sync passed, or say what would be approved
        id: approve
        run: node engineering/release-management/05-src/sync-review/cli.mjs approve

  review:
    name: review Sync
    needs: [verify, approve]
    if: ${{ always() && (startsWith(github.event.pull_request.base.ref, 'kaal/') || startsWith(github.event.pull_request.base.ref, 'hotfix/') || startsWith(github.event.pull_request.base.ref, 'wire/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      KAAL_REPO: ${{ github.repository }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_BASE: ${{ github.event.pull_request.base.ref }}
      KAAL_VERDICT: ${{ needs.verify.outputs.verdict }}
      KAAL_APPROVAL: ${{ needs.approve.outputs.approval }}
      # The person to ask when CODEOWNERS names nobody but the author. Without one, a SYNC that needs a person fails this job.
      KAAL_SYNC_REVIEWER: ${{ vars.KAAL_SYNC_REVIEWER }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Put a SYNC that needs a person in front of one
        run: node engineering/release-management/05-src/sync-review/cli.mjs review
