# Promotion Source: runs KAAL's Promotion-Source check (guard.json, engineering/github/promotion-source.sh)
# through kaal-guard, on where a pull request comes from. The verdict and its guidance live only in the
# branching checker, engineering/github/lineage.ts, and engineering/github/branching.md; a pull request
# into any branch but the default is not applicable.
#
# This is a provider-side promotion gate, separate from Change Isolation's changed-path judgment.
#
# Order, and why: the first step sets the check in_progress for the pull request's head, before anything is
# read, so any earlier pass is revoked at once. The judgment then reacquires every fact itself and the last
# step, which always runs, completes the check from what the judgment and a final head read show. A failed,
# cancelled or unreadable run completes the check as failed, never as a pass.
#
# Trust (release/I64): workflow_run runs this definition from the default branch, so a candidate cannot change
# it. The relay (promotion-source-relay.yml) only hands over a pull request number, which is validated and is
# the only thing taken from it. The job checks out the default branch, which holds kaal-guard and KAAL's
# scripts, and kaal-guard takes the checker from its tip. Only the pull request's refs are judged: nothing of
# the candidate is fetched, checked out or run.
name: KAAL Promotion Source

on:
  workflow_run:
    workflows: ["Promotion Source relay"]
    types: [completed]

permissions: {}

# One pull request at a time and never cancelled mid-run, so the last run to finish never reports older state.
concurrency:
  group: promotion-source-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  promotion-source:
    name: Promotion Source (handler)
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # checks: write sets and completes the check "Promotion Source"; checks: read lets the checker read the
      # check runs on the head (engineering/C16)
      checks: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The check is set in_progress first, from the event payload alone, so nothing that can fail later
      # (the relay itself, its artifact, a download) can leave an earlier pass standing. A relay run that
      # failed or was cancelled still reaches this job and ends with the check completed as failed.
      - name: Set the check in_progress for the current head
        id: pending
        env:
          PAYLOAD_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PAYLOAD_HEAD: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          set -e
          NUMBER="$PAYLOAD_NUMBER"
          case "$NUMBER" in ''|*[!0-9]*) echo "::error::the pull request number cannot be read from the event"; exit 2;; esac
          HEAD=""
          for wait in 0 2 4; do
            sleep "$wait"
            HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha 2>/dev/null || true)
            [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] && break
            HEAD=""
          done
          UNREAD=no
          if [ -z "$HEAD" ]; then HEAD="$PAYLOAD_HEAD"; UNREAD=yes; fi
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the head cannot be read"; exit 2; }
          ID=""
          for wait in 0 2 4; do
            sleep "$wait"
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="Promotion Source" -f head_sha="$HEAD" \
              -f status=in_progress -f "output[title]=Promotion Source: judging" \
              -f "output[summary]=The source of the pull request is being judged." --jq .id 2>/dev/null) && break
            ID=""
          done
          [ -n "$ID" ] || { echo "::error::the check cannot be set in_progress"; exit 2; }
          { echo "number=$NUMBER"; echo "head=$HEAD"; echo "check=$ID"; } >> "$GITHUB_OUTPUT"
          [ "$UNREAD" = no ] || { echo "::error::the pull request's current head cannot be read; the check is left unsuccessful"; exit 2; }

      - if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pull-request
          path: ${{ runner.temp }}/relay
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: The relayed number must agree with the event
        if: github.event.workflow_run.conclusion == 'success'
        env:
          NUMBER: ${{ steps.pending.outputs.number }}
        run: |
          # The artifact is untrusted: it lives outside the checkout and only this one file is read.
          RELAYED=$(cat "$RUNNER_TEMP/relay/pull-request.txt")
          [ "$RELAYED" = "$NUMBER" ] || { echo "::error::the relayed number ($RELAYED) differs from the event's ($NUMBER)"; exit 2; }

      - name: Check out the default branch
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - if: github.event.workflow_run.conclusion == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - if: github.event.workflow_run.conclusion == 'success'
        run: npm ci --ignore-scripts

      - name: Judge the source with the default branch's checker
        id: judge
        if: github.event.workflow_run.conclusion == 'success'
        env:
          NUMBER: ${{ steps.pending.outputs.number }}
          KAAL_REPO: ${{ github.repository }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # Every fact is read from the API; none comes from the relay or the event payload.
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          BASE_REF=$(jq -r .base.ref <<<"$PR")
          # kaal/<capability>/*, hotfix/* and wire/* heads are admitted only when the checks their rulesets require are
          # green on this exact commit; the checker reads the rules and check runs through the API (engineering/C16)
          export KAAL_HEAD_REPO=$(jq -r .head.repo.full_name <<<"$PR")
          export KAAL_HEAD_REF=$(jq -r .head.ref <<<"$PR")
          export KAAL_HEAD_SHA=$(jq -r .head.sha <<<"$PR")
          npx --no kaal-guard run --check Promotion-Source --github --base "$(git rev-parse HEAD)" --base-ref "$BASE_REF"

      - name: Complete the check from the verdict and a final read of the head
        if: always()
        env:
          NUMBER: ${{ steps.pending.outputs.number }}
          CHECK: ${{ steps.pending.outputs.check }}
          PENDING_HEAD: ${{ steps.pending.outputs.head }}
          VERDICT: ${{ steps.judge.outcome }}
        run: |
          [ -n "$CHECK" ] || exit 0
          conclusion=failure
          summary="Promotion Source could not be established; the check is left unsuccessful."
          NOW=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha || true)
          if [ "$VERDICT" = success ] && [ "$NOW" = "$PENDING_HEAD" ]; then
            conclusion=success
            summary="The source of the pull request conforms."
          elif [ "$VERDICT" = success ]; then
            summary="The head moved while judging; the new head is judged by its own run."
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK" -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=Promotion Source" -f "output[summary]=$summary"
