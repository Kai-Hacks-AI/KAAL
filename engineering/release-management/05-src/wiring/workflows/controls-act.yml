# The four judges of the ACT and the control isolate Changes they consume (release/C123, release/CTL33), on every pull request into a collector (release/C122, release/I65). The judge is the default branch's and is run; the pull request is data,
# its merge result checked out beside it, never installed or run, no credentials kept. Plain pull_request, never pull_request_target; no token, no secret.
# Detective: a job reports its verdict and passes. Advisory: only when the variable of that judge is exactly `on`, a FAIL or an UNKNOWN makes the job red, and the check is still
# not required by any ruleset. Preventive (requiring a check) is a ruleset change by the Owner, never this file or a variable.
name: controls ACT

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ['kaal/**']

permissions:
  contents: read

jobs:
  # The observation hold Act reads (release/C135). Two jobs, so that the step that runs candidate code is not the step that writes the evidence: run Cases runs the Cases of the carried
  # Changes with Testing of the default branch and uploads the run report only; observe Cases runs no candidate code, reads that report as untrusted data and writes the observation.
  # Advisory like the rest: nothing here is required by a ruleset, and a forged verdict in a well-formed report is not detected (release/C135, residual risk).
  run-cases:
    name: run Cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, Testing and the lister
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-core -w @kaihacksai/kaal-hosting
      - name: Check out the merge result, as the tree whose Cases run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          persist-credentials: false
      - name: List the Cases of the carried Changes, then run them with Testing of the default branch
        run: |
          node engineering/release-management/05-src/phase/list-carried-cases.mjs --main . --pr pr > cases.txt
          if [ -s cases.txt ]; then
            node packages/kaal-testing/bin/kaal-testing.mjs run --root "$GITHUB_WORKSPACE/pr" $(cat cases.txt) > run-report.json
          else
            echo '{}' > run-report.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-report
          path: run-report.json
          retention-days: 1

  observe-cases:
    name: observe Cases
    needs: run-cases
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, Testing and the assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w kaal-core -w @kaihacksai/kaal-hosting
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-report
      - name: Observe the Cases at the revision of the merge result
        env:
          KAAL_MERGE_SHA: ${{ github.sha }}
          KAAL_RUN_ID: ${{ github.run_id }}
        run: |
          node engineering/release-management/05-src/phase/list-carried-cases.mjs --main . --pr pr > cases.txt
          node packages/kaal-testing/bin/kaal-testing.mjs observe --root "$GITHUB_WORKSPACE/pr" --report run-report.json --revision "$KAAL_MERGE_SHA" --expect-revision "$KAAL_MERGE_SHA" --run-id "$KAAL_RUN_ID" --produced-by observe-cases --observed observed.json --evidence evidence.json
          node engineering/release-management/05-src/phase/assemble-observation.mjs --observed observed.json --evidence evidence.json --report run-report.json --cases cases.txt --out observation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation
          path: observation.json
          retention-days: 1

  hold-act:
    name: hold Act
    needs: observe-cases
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_HOLD_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Bring the observation, when there is one
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: observation
      - name: Judge
        run: |
          if [ -s observation.json ]; then
            node engineering/release-management/05-src/phase/run-controls-act.mjs hold --main . --pr pr --before before --contained contained --evidence observation.json
          else
            node engineering/release-management/05-src/phase/run-controls-act.mjs hold --main . --pr pr --before before --contained contained
          fi

  demand-act:
    name: demand Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_DEMAND_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs demand --main . --pr pr --before before --contained contained

  verify-act:
    name: verify Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_VERIFY_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs verify --main . --pr pr --before before --contained contained

  limit-act:
    name: limit Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_LIMIT_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs limit --main . --pr pr --before before --contained contained

  isolate-changes:
    name: isolate Changes
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_ISOLATE_CHANGES }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs isolate --main . --pr pr --before before --contained contained
