# The four judges of the ACT and the control isolate Changes they consume (release/C123, release/CTL33), on every pull request into a collector (release/C122, release/I65). The judge is the default branch's and is run; the pull request is data,
# its merge result checked out beside it, never installed or run, no credentials kept. Plain pull_request, never pull_request_target; no token, no secret.
# Detective: a job reports its verdict and passes. Advisory: only when the variable of that judge is exactly `on`, a FAIL or an UNKNOWN makes the job red, and the check is still
# not required by any ruleset. Preventive (requiring a check) is a ruleset change by the Owner, never this file or a variable.
name: controls ACT

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ['kaal/**']

permissions:
  contents: read

jobs:
  hold-act:
    name: hold Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_HOLD_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs hold --main . --pr pr --before before --contained contained

  demand-act:
    name: demand Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_DEMAND_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs demand --main . --pr pr --before before --contained contained

  verify-act:
    name: verify Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_VERIFY_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs verify --main . --pr pr --before before --contained contained

  limit-act:
    name: limit Act
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_LIMIT_ACT }}
      KAAL_PR: ${{ github.event.pull_request.number }}
      KAAL_MERGE_SHA: ${{ github.sha }}
      KAAL_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs limit --main . --pr pr --before before --contained contained

  isolate-changes:
    name: isolate Changes
    runs-on: ubuntu-latest
    env:
      KAAL_FLAG: ${{ vars.KAAL_RELEASE_ISOLATE_CHANGES }}
    steps:
      - name: Check out the default branch, the judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check out the merge result, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Bring the collector before the pull request and main as the result contains it, as folders (isolate Changes)
        run: |
          git -C pr fetch --no-tags "$GITHUB_WORKSPACE" HEAD
          git -C pr worktree add --detach ../before "$(git -C pr rev-parse HEAD^1)"
          git -C pr worktree add --detach ../contained "$(git -C pr merge-base HEAD FETCH_HEAD)"
      - name: Judge
        run: node engineering/release-management/05-src/phase/run-controls-act.mjs isolate --main . --pr pr --before before --contained contained
