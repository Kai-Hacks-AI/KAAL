# Branching (engineering/github/lineage.ts) on plain pull_request, the detective replacement of the pull_request_target workflow lineage-synchronization.yml (release/C153, check 2).
# The rules and their verdicts live only in the checker, engineering/github/lineage.ts. Each of its three verdicts runs as its own job through its delivered entry and the controls adapter (release/C158): freshness (release/CTL37), synchronization (release/CTL38) and auto-merge (release/CTL39).
# Only the trigger and how the facts arrive differ from the old workflow: plain pull_request, no token beyond contents: read, no secret, no pull_request_target.
# The default branch is checked out as the trusted judge. The candidate is fetched as Git data from refs/pull/<n>/head and is never checked out, built, installed or run.
# Required context (release/C168): the aggregator job `Branching` takes the name the rulesets require and needs every entry below; the entries keep their own names. The old workflow keeps running unrequired, its job carrying the marker `(legacy`.
name: Branching on pull_request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, auto_merge_enabled, auto_merge_disabled]

permissions:
  contents: read

jobs:
  freshness:
    name: "Branching: freshness (plain pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Fetch the proposed head as Git data and read the branches at their current tips
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || {
            echo "::error title=Branching: cannot judge::the proposed head cannot be read"; exit 2; }
          HEAD=$(git rev-parse --verify "refs/remotes/pull/head^{commit}") || exit 2
          # The head read is the revision the event was raised for. A pull request that moved since is judged by its own newer event, never by this one.
          [ "$HEAD" = "$EVENT_HEAD" ] || {
            echo "::error title=Branching: cannot judge::the head read ($HEAD) is not the revision of the event ($EVENT_HEAD)"; exit 2; }
          git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || {
            echo "::error title=Branching: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"

      - name: Judge with the default branch's checker
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
          KAAL_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node engineering/release-management/05-src/lineage/judge-freshness.mjs --head "$HEAD" --base-ref "$BASE_REF"

  synchronization:
    name: "Branching: synchronization (plain pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Fetch the proposed head as Git data and read the branches at their current tips
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || {
            echo "::error title=Branching: cannot judge::the proposed head cannot be read"; exit 2; }
          HEAD=$(git rev-parse --verify "refs/remotes/pull/head^{commit}") || exit 2
          # The head read is the revision the event was raised for. A pull request that moved since is judged by its own newer event, never by this one.
          [ "$HEAD" = "$EVENT_HEAD" ] || {
            echo "::error title=Branching: cannot judge::the head read ($HEAD) is not the revision of the event ($EVENT_HEAD)"; exit 2; }
          git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || {
            echo "::error title=Branching: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"

      - name: Judge with the default branch's checker
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
        run: node engineering/release-management/05-src/lineage/judge-synchronization.mjs --head "$HEAD" --base-ref "$BASE_REF"

  auto-merge:
    name: "Branching: auto-merge (plain pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Fetch the proposed head as Git data and read the branches at their current tips
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || {
            echo "::error title=Branching: cannot judge::the proposed head cannot be read"; exit 2; }
          HEAD=$(git rev-parse --verify "refs/remotes/pull/head^{commit}") || exit 2
          # The head read is the revision the event was raised for. A pull request that moved since is judged by its own newer event, never by this one.
          [ "$HEAD" = "$EVENT_HEAD" ] || {
            echo "::error title=Branching: cannot judge::the head read ($HEAD) is not the revision of the event ($EVENT_HEAD)"; exit 2; }
          git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || {
            echo "::error title=Branching: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"

      # Under a merge queue GitHub reports every auto-merge method as "merge", so the method the trusted ruleset configures decides (engineering/github/lineage.ts, effectiveMethod).
      # The rules are read from GitHub's rules/branches response for the base branch, only when the base is the default branch; a response that cannot be read is UNKNOWN.
      - name: Read the base branch's rules
        if: github.event.pull_request.base.ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/$BASE_REF" > "$RUNNER_TEMP/rules.json" \
            || { echo "::error title=Branching: cannot judge::the rules of $BASE_REF cannot be read"; exit 2; }
          echo "KAAL_RULES=$RUNNER_TEMP/rules.json" >> "$GITHUB_ENV"

      - name: Judge with the default branch's checker
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
          KAAL_AUTO_MERGE: ${{ github.event.pull_request.auto_merge.merge_method }}
        run: node engineering/release-management/05-src/lineage/judge-auto-merge.mjs --head "$HEAD" --base-ref "$BASE_REF"

  branching:
    # The required context (release/C168): it passes only when every needed entry succeeded, with nothing else in it.
    name: Branching
    needs: [freshness, synchronization, auto-merge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error title=Branching::a needed job did not succeed ($r)"; exit 1; }
          done
