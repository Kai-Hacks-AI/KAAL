# Change Isolation (engineering/change-isolation) on plain pull_request, the detective replacement of the pull_request_target workflow (release/C153, check 1).
# The rule and its verdict live only in the checker, engineering/change-isolation/check.mjs. Each of its two verdicts runs as its own job through its delivered entry and the controls adapter (release/C160): `.github` alone (release/CTL42) and delivery (release/CTL23)..
# Only the trigger and how the proposed head arrives differ from the old workflow: plain pull_request, no token beyond contents: read, no secret, no pull_request_target.
# The default branch is checked out as the trusted judge. The candidate is fetched as Git data from refs/pull/<n>/head (release/C90) and is never checked out, built, installed or run.
# Required context (release/C168): the aggregator job `Change Isolation` takes the name the rulesets require and needs every entry below; the entries keep their own names. The old workflow keeps running unrequired, its job carrying the marker `(legacy`.
name: Change Isolation on pull_request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  github-alone:
    name: "Change Isolation: .github alone (plain pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Fetch the proposed head as Git data and read the target's current tip
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || {
            echo "::error title=Change Isolation: cannot judge::the proposed head cannot be read"; exit 2; }
          HEAD=$(git rev-parse --verify "refs/remotes/pull/head^{commit}") || exit 2
          # The head read is the revision the event was raised for. A pull request that moved since is judged by its own newer event, never by this one.
          [ "$HEAD" = "$EVENT_HEAD" ] || {
            echo "::error title=Change Isolation: cannot judge::the head read ($HEAD) is not the revision of the event ($EVENT_HEAD)"; exit 2; }
          BASE=$(git rev-parse --verify "origin/$BASE_REF^{commit}") || {
            echo "::error title=Change Isolation: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Judge the complete change against the target
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
          KAAL_ATTESTATION: deferred
        run: node engineering/release-management/05-src/change-isolation/judge-github-alone.mjs --head "$HEAD" --base "$BASE" --base-ref "$BASE_REF"

  delivery:
    name: "Change Isolation: delivery (plain pull_request)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch, the trusted judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Fetch the proposed head as Git data and read the target's current tip
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || {
            echo "::error title=Change Isolation: cannot judge::the proposed head cannot be read"; exit 2; }
          HEAD=$(git rev-parse --verify "refs/remotes/pull/head^{commit}") || exit 2
          # The head read is the revision the event was raised for. A pull request that moved since is judged by its own newer event, never by this one.
          [ "$HEAD" = "$EVENT_HEAD" ] || {
            echo "::error title=Change Isolation: cannot judge::the head read ($HEAD) is not the revision of the event ($EVENT_HEAD)"; exit 2; }
          BASE=$(git rev-parse --verify "origin/$BASE_REF^{commit}") || {
            echo "::error title=Change Isolation: cannot judge::the target $BASE_REF cannot be read"; exit 2; }
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Judge delivery apart from solution in the complete change
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KAAL_DEFAULT: ${{ github.event.repository.default_branch }}
          KAAL_ATTESTATION: deferred
        run: node engineering/release-management/05-src/change-isolation/judge-delivery.mjs --head "$HEAD" --base "$BASE" --base-ref "$BASE_REF"

  change-isolation:
    # The required context (release/C168): it passes only when every needed entry succeeded, with nothing else in it.
    name: Change Isolation
    needs: [github-alone, delivery]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error title=Change Isolation::a needed job did not succeed ($r)"; exit 1; }
          done
