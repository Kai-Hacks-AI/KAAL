# Relay for the Promotion Source check (release/I64, release/A100). A pull_request event runs the workflow
# definition found on the pull request's own commit, so a candidate could edit this file; it is therefore
# trusted for nothing. It holds no permission and only records the pull request's number as an artifact. The
# handler (promotion-source.yml) runs from the default branch on this workflow's completion and reacquires
# every fact itself.
name: Promotion Source relay

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  relay:
    name: Relay pull request
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record the pull request number
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PULL_REQUEST" > pull-request.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pull-request
          path: pull-request.txt
          retention-days: 1
